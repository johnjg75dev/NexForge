[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralforge"
version = "0.1.0"
description = "Object-oriented neural network development platform"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4,<2", "joblib>=1.3,<2", "pandas>=2.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
